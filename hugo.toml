# ============================================
# 基础站点配置
# ============================================
baseURL = "https://qisrepo.top/"
locale = "zh-cn"
title = "QisRepo"
theme = "hextra"

defaultContentLanguage ="zh-cn"

# ============================================
# Hugo 全局功能开关
# ============================================
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true
hasCJKLanguage = true

enableInlineShortcodes = true

# ============================================
# 输出格式配置
# ============================================
[outputs]
  home = ["html", "rss", "llms"]
  page = ["html"]
  section = ["html", "rss"]

# ============================================
# Markdown 渲染器配置
# ============================================
[markup]
  [markup.highlight]
    noClasses = false
  
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]

# ============================================
# 主导航菜单配置
# ============================================
[[menu.main]]
  identifier = "recent"
  name = "最近更新"
  pageRef = "/recent"
  weight = 1

# [[menu.main]]
#   identifier = "notes"
#   name = "笔记"
#   pageRef = "/notes"
#   weight = 2

[[menu.main]]
  identifier = "tags"
  name = "标签"
  pageRef = "/tags"
  weight = 3

[[menu.main]]
  identifier = "about"
  name = "关于"
  pageRef = "/about"
  weight = 4

[[menu.main]]
  name = "Search"
  weight = 10
  [menu.main.params]
    type = "search"

[[menu.main]]
  name = "GitHub"
  weight = 100
  url = "https://github.com/qisork/"
  [menu.main.params]
    icon = "github"

# ============================================
# 网站参数配置
# ============================================
[params]
  dateFormat = "2006-01-02"
  displayUpdatedDate = true
  externalLinkDecoration = true
  description = """\
    QisRepo 是一个个人技术博客,\
    专注于记录学习过程、分享编程经验和展示项目成果。\
    这里包含了我的技术探索、实践经验和个人成长轨迹。
    """

  # ----------------------------------------
  # 导航栏配置
  # ----------------------------------------
  [params.navbar]
    [params.navbar.logo]
      path = "favicon.svg"
      dark = "favicon.svg"

  # ----------------------------------------
  # 页脚配置
  # ----------------------------------------
  [params.footer]
    displayCopyright = false

  # ----------------------------------------
  # 编辑链接配置
  # ----------------------------------------
  [params.editURL]
    enable = false

  # ----------------------------------------
  # 博客功能配置
  # ----------------------------------------
  [params.blog]
    [params.blog.list]
      displayTags = true
    
    [params.blog.article]
      displayPagination = true

  # ----------------------------------------
  # 右侧目录功能配置
  # ----------------------------------------
  [params.toc]
    displayTags = true

  # ----------------------------------------
  # 最近更新页面配置
  # ----------------------------------------
  [params.recent]
    count = 18
    pagerSize = 6
    displayTags = true
    excludeSections = ["about", "tags", "categories"]

  # ----------------------------------------
  # 评论系统配置
  # ----------------------------------------
  [params.comments]
    enable = false
    type = "giscus"

  # ----------------------------------------
  # 数学公式引擎配置
  # ----------------------------------------
  [params.math]
    engine = "mathjax"
